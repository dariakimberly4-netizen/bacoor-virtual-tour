<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bacoor Heritage Virtual Tour</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07131d;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.scene{height:100dvh;position:relative;overflow:hidden;background:#07131d}.photo{position:absolute;inset:-5%;background-position:center;background-size:cover;transform:scale(1.08);transition:background-image .5s ease;animation:drift 16s ease-in-out infinite alternate}.shade{position:absolute;inset:0;background:linear-gradient(90deg,#06121dbb,#06121d20 68%),linear-gradient(transparent 45%,#061019ed)}@keyframes drift{to{transform:scale(1.16) translate3d(-1.4%,.7%,0)}}@media(prefers-reduced-motion:reduce){.photo{animation:none}}
.top{position:absolute;z-index:5;top:max(18px,env(safe-area-inset-top));left:20px;right:20px;display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-weight:900;letter-spacing:.13em;font-size:12px}.top button,.round{border:1px solid #ffffff55;background:#07131dcc;color:#fff;backdrop-filter:blur(12px)}
.landmarks{position:absolute;z-index:6;top:70px;left:16px;right:16px;display:flex;gap:8px;overflow:auto;scrollbar-width:none}.landmarks button{white-space:nowrap;border:1px solid #ffffff35;background:#07131db8;color:#fff;border-radius:999px;padding:11px 14px;font-weight:750}.landmarks button.on{background:#f1cf7a;color:#10202a;border-color:#f1cf7a}
.hotspot{position:absolute;z-index:4;left:66%;top:39%;width:58px;height:58px;border-radius:50%;border:1px solid #fff;background:#f1cf7ad9;color:#10202a;font-size:24px;font-weight:900;box-shadow:0 0 0 10px #f1cf7a28;animation:pulse 2s infinite}@keyframes pulse{50%{box-shadow:0 0 0 22px #f1cf7a05}}
.copy{position:absolute;z-index:5;left:22px;right:22px;bottom:145px;max-width:720px}.eyebrow{font-size:11px;letter-spacing:.2em;color:#f1cf7a;font-weight:900}.copy h1{font-family:Georgia,serif;font-size:clamp(36px,8vw,72px);line-height:.95;margin:9px 0}.copy p{font-size:14px;line-height:1.5;max-width:570px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.actions button{min-height:46px;border-radius:999px;padding:0 15px;font-weight:800}.narrate{border:0;background:#f1cf7a;color:#10202a}.info{border:1px solid #ffffff55;background:#07131dc9;color:#fff}.bottom{position:absolute;z-index:6;bottom:max(22px,env(safe-area-inset-bottom));left:18px;right:18px;display:flex;gap:9px}.bottom button{min-height:55px;border-radius:999px;font-weight:850;font-size:14px}.round{width:58px;border-radius:50%}.next{flex:1;border:0;background:#f1cf7a;color:#10202a}.credit{position:absolute;z-index:5;bottom:112px;left:22px;font-size:9px;color:#ffffffa8}.credit a{color:inherit}.panel{position:absolute;z-index:10;left:14px;right:14px;bottom:14px;background:#081722f4;border:1px solid #ffffff30;border-radius:24px;padding:20px;transform:translateY(120%);transition:.35s;backdrop-filter:blur(18px)}.panel.open{transform:none}.panel h2{margin:0 0 8px;font-family:Georgia,serif}.panel p{line-height:1.55;color:#e9eef2}.panel button{width:100%;min-height:48px;border:0;border-radius:999px;background:#f1cf7a;color:#10202a;font-weight:850}

.walk{position:absolute;z-index:5;left:50%;bottom:76px;transform:translateX(-50%);width:86px;height:86px;border-radius:50%;border:2px solid #f1cf7a;background:#07131dc9;color:#fff;font-size:30px;font-weight:900;backdrop-filter:blur(12px);box-shadow:0 0 0 8px #f1cf7a20}.walk small{display:block;font-size:9px;letter-spacing:.12em;margin-top:-3px}.photo.step{animation:stepForward .7s ease}@keyframes stepForward{0%{transform:scale(1.08)}45%{transform:scale(1.24) translateY(1%)}100%{transform:scale(1.12)}}.footsteps{position:absolute;z-index:4;left:50%;bottom:168px;transform:translateX(-50%);font-size:18px;letter-spacing:9px;opacity:.75}

/* Immersive photo-walk upgrade */
.scene{perspective:900px;overflow:hidden;touch-action:pan-y}.photo{transform-origin:center center;transition:transform .18s ease-out,filter .4s ease;will-change:transform}.scene.walking .photo{animation:humanWalk 3.2s ease-in-out infinite alternate}@keyframes humanWalk{0%{transform:scale(1.12) translate3d(-.5%,0,0)}50%{transform:scale(1.17) translate3d(.5%,-.35%,0)}100%{transform:scale(1.22) translate3d(-.3%,.15%,0)}}.lookHint{position:absolute;z-index:5;top:74px;left:50%;transform:translateX(-50%);padding:7px 12px;border:1px solid #ffffff42;border-radius:999px;background:#06111ab0;color:#fff;font-size:11px;letter-spacing:.08em;backdrop-filter:blur(8px);pointer-events:none;transition:opacity .5s}.scene.userLooking .lookHint{opacity:0}.walk.active{box-shadow:0 0 0 9px #f1cf7a26,0 0 28px #f1cf7a55}.walk.active small:after{content:"ING…"}.walk.active small{font-size:0}.walk.active small:after{font-size:9px}

/* V2 first-person walking mode */
body.walkMode .top,body.walkMode .bottom{opacity:.18;transition:opacity .3s}body.walkMode .top:hover,body.walkMode .bottom:hover{opacity:1}
.pathway{position:absolute;z-index:3;left:50%;bottom:-5vh;width:58vw;height:48vh;transform:translateX(-50%);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);background:linear-gradient(to bottom,transparent,#ffffff08 42%,#ffffff18);pointer-events:none;opacity:0;transition:opacity .3s}.walkMode .pathway{opacity:1}
.fpHud{position:absolute;z-index:8;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:10px;align-items:center}.fpHud button{width:64px;height:64px;border-radius:50%;border:1px solid #ffffff55;background:#07131ddd;color:white;font-size:25px;backdrop-filter:blur(10px)}.fpHud .forward{width:82px;height:82px;border:2px solid #f1cf7a;font-size:32px}.fpHud span{display:block;font-size:8px;letter-spacing:.08em}
.walkMode .photo{animation:firstPersonWalk 1.05s ease-in-out infinite alternate!important}@keyframes firstPersonWalk{0%{transform:scale(1.16) translate(-1%,.5%)}50%{transform:scale(1.23) translate(1%,-1%)}100%{transform:scale(1.30) translate(-.5%,.2%)}}
<body><main class="scene" id="scene"><div class="photo" id="photo"></div><div class="shade"></div><div class="top"><div class="brand">BACOOR • CAVITE</div><button class="round" id="motion" aria-label="Pause movement">Ⅱ</button></div><nav class="landmarks" id="landmarks" aria-label="Choose landmark"></nav><button class="hotspot" id="hotspot" aria-label="Explore landmark story">＋</button><section class="copy"><div class="eyebrow">IMMERSIVE HERITAGE TOUR</div><h1 id="title"></h1><p id="desc"></p><div class="actions"><button class="narrate" id="narrate">▶ LISTEN</button><button class="info" id="story">✦ EXPLORE HOTSPOT</button></div></section><div class="credit" id="credit"></div><div class="lookHint">DRAG / MOVE TO LOOK AROUND</div><div class="footsteps">• • •</div><button class="walk" id="walk">↑<small>WALK</small></button><div class="bottom"><button class="round" id="prev">←</button><button class="next" id="next">NEXT LANDMARK →</button></div><aside class="panel" id="panel"><h2 id="panelTitle"></h2><p id="panelText"></p><button id="close">RETURN TO TOUR</button></aside></main><script>
const C="https://commons.wikimedia.org/wiki/Special:Redirect/file/";
const stops=[
{short:"St. Michael",t:"St. Michael the Archangel Parish",d:"Begin in Bacoor’s historic center at the Parish of Saint Michael the Archangel.",story:"Look closely at the church façade and imagine the generations of Bacooreños who gathered around this historic town center.",img:"st_michael_bacoor_cropped.jpg",src:"BacoorChurchjf0207 01.JPG"},
{short:"Bahay na Tisa",t:"Bahay na Tisa",d:"Visit the Cuenca Ancestral House, one of Bacoor’s remembered heritage structures.",story:"This ancestral house connects the tour to Bacoor’s revolutionary-era memory. Explore its traditional architecture and the stories preserved around the site.",img:"bahay_na_tisa_cropped-1.jpg",src:"Cuenca Ancestral House north entrance and historical marker.jpg"},
{short:"Zapote Bridge",t:"Zapote Bridge",d:"Stand at the historic bridge and battlefield at Bacoor’s gateway.",story:"The Zapote Bridge area witnessed major battles in 1897 and 1899. The bridge remains a powerful physical connection between place and national history.",img:"zapote_bridge_cropped.jpg",src:"Zapote Bridge (Bacoor, Cavite; 09-19-2021).jpg"},
{short:"Padre Gomes",t:"Plaza de Padre Mariano Gomes",d:"Enter Bacoor’s town plaza and encounter the memory of Padre Mariano Gomes.",story:"The plaza honors Padre Mariano Gomes, one of GOMBURZA. Pause here to explore how Bacoor remembers people whose stories became part of Philippine history.",img:C+"Plaza de Padre Mariano Gomes, Bacoor, Cavite, Aug 2025.jpg?width=1800",src:"Plaza de Padre Mariano Gomes, Bacoor, Cavite, Aug 2025.jpg"},
{short:"Molino Dam",t:"Molino Dam",d:"Finish beside a historic water structure in Bacoor’s Molino area.",story:"The dam adds another layer to Bacoor’s heritage: the relationship between water, agriculture, settlement, and the city’s changing landscape.",img:C+"Molino Dam - 2.jpg?width=1800",src:"Molino Dam - 2.jpg"}];
let i=0,x=0,speaking=false,moving=true;const $=id=>document.getElementById(id);
function render(){const s=stops[i];$("photo").style.backgroundImage='url("'+encodeURI(s.img)+'")';$("title").textContent=s.t;$("desc").textContent=s.d;$("panelTitle").textContent=s.t;$("panelText").textContent=s.story;$("credit").innerHTML='Real landmark photo • <a target="_blank" rel="noopener" href="'+encodeURI("https://commons.wikimedia.org/wiki/File:"+s.src)+'">Wikimedia Commons</a>';$("landmarks").innerHTML=stops.map((v,j)=>'<button data-i="'+j+'" class="'+(j===i?'on':'')+'">'+(j+1)+'. '+v.short+'</button>').join("");document.querySelectorAll("#landmarks button").forEach(b=>b.addEventListener("click",()=>{i=+b.dataset.i;stopVoice();render()}))}
let walking=false,lookX=0,lookY=0;
function walk(){walking=!walking;const s=document.querySelector(".scene"),b=$("walk");s.classList.toggle("walking",walking);b.classList.toggle("active",walking);if(walking&&navigator.vibrate)navigator.vibrate(25)}
function look(x,y){if(walking)return;lookX=Math.max(-1,Math.min(1,x));lookY=Math.max(-1,Math.min(1,y));$("photo").style.transform="scale(1.18) translate("+(-lookX*3)+"%,"+(-lookY*2)+"%)";document.querySelector(".scene").classList.add("userLooking")}
const sc=document.querySelector(".scene");
sc.addEventListener("pointermove",e=>{if(e.pointerType==="mouse")look((e.clientX-innerWidth/2)/(innerWidth/2),(e.clientY-innerHeight/2)/(innerHeight/2))});
sc.addEventListener("touchmove",e=>{const t=e.touches[0];look((t.clientX-innerWidth/2)/(innerWidth/2),(t.clientY-innerHeight/2)/(innerHeight/2))},{passive:true});
window.addEventListener("deviceorientation",e=>{if(e.gamma!=null)look(e.gamma/35,(e.beta-45)/35)},true);
function go(n){i=(i+n+stops.length)%stops.length;stopVoice();$("panel").classList.remove("open");render()}function openStory(){$("panel").classList.add("open")}function stopVoice(){if("speechSynthesis"in window)speechSynthesis.cancel();speaking=false;$("narrate").textContent="▶ LISTEN"}
$("walk").addEventListener("click",walk);$("prev").addEventListener("click",()=>go(-1));$("next").addEventListener("click",()=>go(1));$("hotspot").addEventListener("click",openStory);$("story").addEventListener("click",openStory);$("close").addEventListener("click",()=>$("panel").classList.remove("open"));
$("narrate").addEventListener("click",()=>{if(!("speechSynthesis"in window)){alert("Narration is not supported on this browser.");return}if(speaking){stopVoice();return}const s=stops[i],u=new SpeechSynthesisUtterance(s.t+". "+s.d+" "+s.story);u.rate=.9;u.onend=stopVoice;speaking=true;$("narrate").textContent="■ STOP";speechSynthesis.speak(u)});
$("motion").addEventListener("click",()=>{moving=!moving;$("photo").style.animationPlayState=moving?"running":"paused";$("motion").textContent=moving?"Ⅱ":"▶";$("motion").setAttribute("aria-label",moving?"Pause movement":"Play movement")});
$("scene").addEventListener("touchstart",e=>x=e.touches[0].clientX,{passive:true});$("scene").addEventListener("touchend",e=>{let d=e.changedTouches[0].clientX-x;if(Math.abs(d)>65)d<0?go(1):go(-1)},{passive:true});render();
</script><div class="pathway"></div><div class="fpHud"><button id="lookL">←<span>LOOK</span></button><button class="forward" id="fpWalk">↑<span>WALK</span></button><button id="lookR">→<span>LOOK</span></button></div>
<script>
(()=>{let pan=0;const photo=document.getElementById("photo");const apply=()=>{if(!document.body.classList.contains("walkMode"))photo.style.transform="scale(1.2) translateX("+pan+"%)"};document.getElementById("lookL").onclick=()=>{document.body.classList.remove("walkMode");pan=Math.min(7,pan+2.5);apply()};document.getElementById("lookR").onclick=()=>{document.body.classList.remove("walkMode");pan=Math.max(-7,pan-2.5);apply()};document.getElementById("fpWalk").onclick=()=>{document.body.classList.toggle("walkMode");photo.style.transform="";if(navigator.vibrate)navigator.vibrate([20,80,20])};})();
</script></body></html>
