<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bacoor Heritage Adventure</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050b10;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.world{height:100%;position:relative;overflow:hidden;background:#000}.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#050b10;filter:none;image-rendering:auto;transition:transform 1.1s cubic-bezier(.2,.8,.2,1),filter .8s}.veil{position:absolute;inset:0;background:linear-gradient(180deg,#02070b99 0%,transparent 30%,transparent 58%,#02070be8 100%);pointer-events:none}.grain{position:absolute;inset:0;opacity:.13;pointer-events:none;background-image:radial-gradient(#fff 0.6px,transparent .7px);background-size:5px 5px}.top{position:absolute;z-index:6;top:max(14px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:11px;letter-spacing:.18em}.progress{font-size:11px;padding:8px 11px;border:1px solid #ffffff44;border-radius:20px;background:#06111ab8;backdrop-filter:blur(8px)}.title{position:absolute;z-index:5;left:20px;right:20px;bottom:150px;text-shadow:0 3px 20px #000}.title small{letter-spacing:.2em;color:#f1d38b;font-weight:800}.title h1{margin:5px 0 5px;font-size:clamp(27px,7vw,52px);line-height:.96}.title p{margin:0;max-width:560px;font-size:13px;opacity:.86}.hotspot{position:absolute;z-index:7;width:48px;height:48px;border:1px solid #f4d786;border-radius:50%;background:#07131dbd;color:#f4d786;font-size:20px;box-shadow:0 0 0 8px #f4d71c22;animation:pulse 1.8s infinite}@keyframes pulse{50%{box-shadow:0 0 0 18px transparent}}#hot1{left:22%;top:39%}#hot2{right:21%;top:31%}.controls{position:absolute;z-index:9;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:center;gap:11px}.controls button{border:1px solid #ffffff42;background:#07131ddd;color:#fff;border-radius:50%;width:58px;height:58px;font-size:21px;backdrop-filter:blur(10px)}.controls .advance{width:88px;height:88px;border:2px solid #f1d38b;background:#15210fea;box-shadow:0 0 30px #e7c76d32}.advance span{display:block;font-size:8px;letter-spacing:.14em;margin-top:1px}.panel{position:absolute;z-index:20;left:14px;right:14px;bottom:18px;padding:20px;border:1px solid #ffffff35;border-radius:24px;background:#07131df0;backdrop-filter:blur(18px);transform:translateY(130%);transition:.45s}.panel.open{transform:none}.panel b{color:#f1d38b}.panel button{float:right;border:0;background:#fff;color:#111;padding:9px 14px;border-radius:18px}.stamp{position:absolute;z-index:8;right:18px;bottom:155px;width:68px;height:68px;border:2px dashed #f1d38b;border-radius:50%;display:grid;place-items:center;text-align:center;font-size:9px;font-weight:900;color:#f1d38b;transform:rotate(9deg);opacity:.5}.flash{position:absolute;z-index:30;inset:0;background:#f1d38b;pointer-events:none;opacity:0}.flash.go{animation:flash .55s}@keyframes flash{40%{opacity:.7}100%{opacity:0}}.map{position:absolute;z-index:15;inset:0;background:#061018f5;padding:70px 22px 25px;display:none}.map.open{display:block}.map h2{margin:0 0 25px}.route{border-left:2px solid #b99c57;margin-left:14px;padding-left:25px}.stop{margin:0 0 25px;cursor:pointer}.stop b{display:block;color:#f1d38b}.stop i{font-size:11px;opacity:.65}
</style></head><body><main class="world" id="world"><img class="photo" id="photo"><div class="veil"></div><div class="grain"></div><div class="top"><div class="brand">BACOOR • HERITAGE ADVENTURE</div><div class="progress" id="progress"></div></div><button class="hotspot" id="hot1">✦</button><button class="hotspot" id="hot2">◉</button><div class="title"><small id="eyebrow"></small><h1 id="name"></h1><p id="desc"></p></div><div class="stamp" id="stamp">HERITAGE<br>STAMP</div><div class="controls"><button id="mapBtn">⌖</button><button class="advance" id="advance">↑<span>STEP CLOSER</span></button><button id="sound">♫</button></div><section class="panel" id="panel"><button id="close">Close</button><b id="panelTitle"></b><p id="panelText"></p></section><section class="map" id="map"><h2>Your Bacoor Journey</h2><div class="route" id="route"></div></section><div class="flash" id="flash"></div></main><script>
const places=[
{name:"St. Michael the Archangel Parish",img:"st_michael_bacoor_cropped.jpg",desc:"Begin at one of Bacoor's enduring spiritual landmarks.",fact:"Look closely at the church façade and imagine generations of Bacooreños gathering here.",secret:"HERITAGE CLUE • Architecture can preserve community memory long after a moment has passed."},
{name:"Bahay na Tisa",img:"bahay_na_tisa_cropped-1.jpg",desc:"Step toward a surviving window into Bacoor's historic domestic life.",fact:"Explore the details of the ancestral house instead of only viewing it from afar.",secret:"HERITAGE CLUE • Old houses reveal history through materials, openings, proportions and craftsmanship."},
{name:"Zapote Bridge",img:"zapote_bridge_cropped.jpg",desc:"Approach a crossing closely associated with Bacoor's historical landscape.",fact:"A bridge can be more than infrastructure—it can become a witness to events and movement.",secret:"HERITAGE CLUE • Crossings often become strategic places because people, roads and stories converge."},
{name:"Plaza de Padre Mariano Gomes",img:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Plaza%20Padre%20Mariano%20Gomes%20Bacoor%20Cavite.jpg?width=1800",desc:"Enter a civic space connected to Bacoor's public memory.",fact:"Pause here and explore how plazas become gathering places for civic identity.",secret:"HERITAGE CLUE • Public spaces keep history visible by connecting names, monuments and everyday life."},
{name:"Molino Dam",img:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Molino%20Dam%20Bacoor%20Cavite.jpg?width=1800",desc:"Finish beside Bacoor's historic water landscape.",fact:"Water shaped settlement, agriculture, movement and the development of communities.",secret:"FINAL CLUE • Heritage includes landscapes and infrastructure—not only monuments."}
];let i=0,depth=0,stamps=new Set(),audio=false;const $=id=>document.getElementById(id);
function render(){let p=places[i];$("photo").src=p.img;$("photo").style.transform="scale(1)";$("name").textContent=p.name;$("desc").textContent=p.desc;$("eyebrow").textContent="STOP "+String(i+1).padStart(2,"0")+" • DEPTH "+(depth+1)+"/4";$("progress").textContent=(i+1)+" / "+places.length+"  •  "+stamps.size+" STAMPS";$("stamp").style.opacity=stamps.has(i)?1:.42;buildMap()}
function step(){if(depth<3){depth++;$("photo").style.transform="scale(1)";if(navigator.vibrate)navigator.vibrate(22);render()}else{stamps.add(i);$("flash").classList.remove("go");void $("flash").offsetWidth;$("flash").classList.add("go");setTimeout(()=>{i=(i+1)%places.length;depth=0;render()},420)}}
function panel(title,text){$("panelTitle").textContent=title;$("panelText").textContent=text;$("panel").classList.add("open")}
function buildMap(){$("route").innerHTML=places.map((p,n)=>'<div class="stop" data-n="'+n+'"><b>'+(stamps.has(n)?'✓ ':'○ ')+p.name+'</b><i>'+(n===i?'YOU ARE HERE':stamps.has(n)?'STAMP COLLECTED':'UNEXPLORED')+'</i></div>').join("");document.querySelectorAll(".stop").forEach(x=>x.onclick=()=>{i=+x.dataset.n;depth=0;$("map").classList.remove("open");render()})}
$("advance").onclick=step;$("hot1").onclick=()=>panel("DISCOVER",places[i].fact);$("hot2").onclick=()=>panel("HIDDEN CLUE",places[i].secret);$("close").onclick=()=>$("panel").classList.remove("open");$("mapBtn").onclick=()=>$("map").classList.toggle("open");$("sound").onclick=()=>{audio=!audio;$("sound").textContent=audio?"🔊":"♫";if(audio&&"speechSynthesis"in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(places[i].desc))}};render();
</script></body></html>
